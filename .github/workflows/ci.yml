name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/redactor-pl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --experimental-strip-types test/detect.test.mts
      - run: node --experimental-strip-types test/pl.test.mts
      - run: node --experimental-strip-types test/random-tags.test.mts
      - run: node --experimental-strip-types test/session-privacy.test.mts
      - run: node --experimental-strip-types test/pii-options.test.mts
      - run: node --experimental-strip-types test/local-urls.test.mts
      - run: node --experimental-strip-types test/allow.test.mts
  opencode-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/redactor-opencode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/redactor-opencode/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: CI=1 npm test
  grok-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/grok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --experimental-strip-types test/proxy.test.mts
  gemini-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/gemini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --experimental-strip-types test/hooks.test.mts
  no-real-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on a private key block
        run: "! grep -rIn -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' . --exclude-dir=.git --exclude-dir=test --exclude-dir=tests"
